services:
  backend:
    build:
      context: ./backend
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://sara:sara_local_dev@postgres:5432/sara
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: sara
      POSTGRES_PASSWORD: sara_local_dev
      POSTGRES_DB: sara
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sara -d sara"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
