name: Backend delivery
on:
  workflow_run:
    workflows: [Rust QA]
    types: [completed]
    branches: [main]
permissions: {}
concurrency:
  group: backend-delivery-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false
jobs:
  image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/backend-artifacts.yml
    permissions:
      contents: read
    with:
      source-sha: ${{ github.event.workflow_run.head_sha }}
  publish-image:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: backend-runtime-${{ github.event.workflow_run.head_sha }}-*-${{ github.run_id }}
          path: images/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Geprüfte Architekturimages ohne Build veröffentlichen
        id: publish
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}-backend"
          digest=$(.github/scripts/image-ref.sh "$image:sha-$SOURCE_SHA")
          if [ -z "$digest" ]; then
            sources=()
            for arch in amd64 arm64; do
              folder="images/backend-runtime-$SOURCE_SHA-$arch-$GITHUB_RUN_ID"
              python3 .github/scripts/verify-backend-artifact.py "$folder" "$SOURCE_SHA" "$arch" image
              docker load --input "$folder/image.tar"
              tag="$image:build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
              docker tag sara-backend:smoke "$tag"
              docker push "$tag"
              arch_digest=$(.github/scripts/image-ref.sh "$tag")
              test -n "$arch_digest"
              sources+=("$image@$arch_digest")
            done
            docker buildx imagetools create --tag "$image:sha-$SOURCE_SHA" "${sources[@]}"
            digest=$(.github/scripts/image-ref.sh "$image:sha-$SOURCE_SHA")
          fi
          test -n "$digest"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "BACKEND_IMAGE=$image@$digest" >> "$GITHUB_STEP_SUMMARY"
  release:
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: .github/release
      - name: Release-Kandidat für genau diesen QA-Commit prüfen
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/release/release.cjs plan
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.plan.outputs.version != ''
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        if: steps.plan.outputs.version != ''
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Geprüften Digest als Release-Image übernehmen
        if: steps.plan.outputs.version != ''
        env:
          IMAGE: ${{ needs.publish-image.outputs.image }}
          DIGEST: ${{ needs.publish-image.outputs.digest }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          existing=$(.github/scripts/image-ref.sh "$IMAGE:$VERSION")
          if [ -n "$existing" ]; then
            test "$existing" = "$DIGEST"
          else
            docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          fi
          test "$(.github/scripts/image-ref.sh "$IMAGE:$VERSION")" = "$DIGEST"
      - name: Release Please – GitHub Release und Tag
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTED_SHA: ${{ steps.plan.outputs.sha }}
        run: node .github/release/release.cjs publish
