name: Backend image check
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'compose.acceptance.yaml'
      - '.github/scripts/container-smoke.sh'
      - '.github/scripts/image-ref.sh'
      - '.github/workflows/backend-*.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: backend
          load: true
          tags: sara-backend:smoke
          cache-from: type=gha,scope=backend-smoke
          cache-to: type=gha,mode=max,scope=backend-smoke
      - run: docker pull postgres:17
      - name: Isolierter Containerstart und Neustart
        env:
          BACKEND_IMAGE: sara-backend:smoke
        run: .github/scripts/container-smoke.sh
