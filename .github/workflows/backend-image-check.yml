name: Backend image check
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'compose.acceptance.yaml'
      - '.github/scripts/container-smoke.sh'
      - '.github/scripts/verify-backend-artifact.py'
      - '.github/scripts/image-ref.sh'
      - '.github/workflows/backend-*.yml'
permissions:
  contents: read
jobs:
  native:
    uses: ./.github/workflows/backend-artifacts.yml
    with:
      source-sha: ${{ github.sha }}
