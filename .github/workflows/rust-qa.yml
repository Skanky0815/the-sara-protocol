name: Rust QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-qa:
    name: Format, lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sara
          POSTGRES_PASSWORD: sara_ci_test
          POSTGRES_DB: sara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sara -d sara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust with rustfmt and clippy
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Select stable Rust
        run: rustup default stable
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests (including PostgreSQL migration integration)
        env:
          DATABASE_URL: postgres://sara:sara_ci_test@127.0.0.1:5432/sara
        run: cargo test --locked --all-targets --all-features
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependency vulnerabilities
        run: cargo audit
