# Event-driven PR feedback intake.
# This intentionally does NOT execute comment text or modify code.
# An authenticated agent executor must be integrated separately.
name: Sara PR feedback intake

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: sara-feedback-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  intake:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.sender.login == 'Skanky0815' &&
        (
          github.event_name != 'issue_comment' ||
          github.event.issue.pull_request != null
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate PR ownership and capture feedback metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_PATH: ${{ github.event_path }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text())
          name = os.environ["EVENT_NAME"]
          if name == "workflow_dispatch":
              print("Manual smoke test: intake workflow is installed.")
              raise SystemExit(0)
          pr_number = (event.get("pull_request") or event.get("issue") or {}).get("number")
          if not pr_number:
              print("No PR number; ignoring.")
              raise SystemExit(0)
          result = subprocess.run(
              ["gh", "api", f"repos/{os.environ['GH_REPO']}/pulls/{pr_number}",
               "--jq", ".user.login"],
              capture_output=True, text=True, check=True)
          if result.stdout.strip() != "Sara-Pixel42":
              print("PR is not authored by Sara-Pixel42; ignoring.")
              raise SystemExit(0)
          print(f"Eligible feedback event: {name}, PR #{pr_number}")
          print("Agent execution is intentionally not configured yet.")
          PY
