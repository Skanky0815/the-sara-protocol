name: Prepare component release
on:
  workflow_dispatch:
    inputs:
      component:
        description: Komponente (Frontend noch nicht vorhanden)
        type: choice
        options: [backend, frontend]
        default: backend
        required: true
permissions: {}
concurrency:
  group: component-release-backend
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.component == 'backend'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: .github/release
      - name: Release Please – Versions-PR, Review und QA
        env:
          GH_TOKEN: ${{ github.token }}
          COMPONENT: ${{ inputs.component }}
        run: node .github/release/release.cjs prepare
