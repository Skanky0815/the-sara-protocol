name: Workflow validation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/tests/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/tests/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest==8.3.5
      - name: Unit tests
        run: python -m pytest -q .github/tests/test_pr_feedback_intake.py
