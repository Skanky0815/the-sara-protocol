name: Workflow validation

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/tests/**'
      - '.github/release/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/**'
      - '.github/tests/**'
      - '.github/release/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest==9.2.0
      - name: Unit tests
        run: python -m pytest -q .github/tests
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Release-Integration und Standard-Updater prüfen
        working-directory: .github/release
        run: |
          npm ci --ignore-scripts
          npm test
