[package]
name = "the-sara-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
time = { version = "0.3.55", default-features = false, features = ["std", "parsing", "formatting"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-axum = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["trace"] }
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "migrate"] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = ["migrate"] }

[dev-dependencies]
jsonschema = { version = "0.58", default-features = false }
tower = { version = "0.5", features = ["util"] }
